name: verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify-locked (${{ matrix.os }})
    if: github.repository == 'liang-today/dsh-liangxiang'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a personal fork based on current main
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          HEAD_OWNER_TYPE: ${{ github.event.pull_request.head.repo.owner.type }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_DEFAULT_BRANCH: ${{ github.event.pull_request.head.repo.default_branch }}
        run: node scripts/ci/check-pr-base.mjs
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install the audited dependency set
        id: install
        run: pnpm install --frozen-lockfile
      - name: Record tested versions
        run: |
          node --version
          pnpm --version
          pnpm ls --depth 0 @deepseek-ai/dsh @deepseek-ai/cordis @deepseek-ai/cordis-plugin-group @deepseek-ai/dsh-client-ui-layout @deepseek-ai/dsh-client-ui-renderer @deepseek-ai/dsh-client-ui-slots
      - name: Typecheck, lint, tests, build and client budget
        id: checks
        run: |
          node --test scripts/ci/check-pr-base.test.mjs scripts/ci/deploy-ssh.test.mjs scripts/ci/deploy-permissions.test.mjs
          pnpm run verify
      - name: Summarize the required check
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          VERIFY_RESULT: ${{ steps.checks.outcome }}
        run: |
          {
            echo "### Locked dependencies: $RUNNER_OS"
            echo "- Commit: $GITHUB_SHA"
            echo "- Install: $INSTALL_RESULT"
            echo "- Complete verification: $VERIFY_RESULT"
            echo "This job is a required merge check. It does not publish or deploy."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: smoke-installed
    if: github.repository == 'liang-today/dsh-liangxiang'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm exec playwright install --with-deps chromium
      - name: Packed installation and desktop, narrow, dark browser checks
        timeout-minutes: 15
        run: pnpm run smoke:browser-clean-profile
      - name: Isolated backend and Host online loop
        timeout-minutes: 10
        run: pnpm run smoke:online
