name: Publication privacy
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:
    inputs:
      base_sha:
        type: string
        default: ''
      head_sha:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  privacy:
    name: privacy
    if: github.repository == 'liang-today/dsh-liangxiang'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.base_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.1
      - name: Check public text, files and introduced commit history
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node --test scripts/ci/check-privacy.test.mjs
          if [ -n "$BASE_SHA" ]; then
            node scripts/ci/check-privacy.mjs --range "$BASE_SHA..$HEAD_SHA" --ref "$HEAD_SHA" --community-pr
          else
            node scripts/ci/check-privacy.mjs
          fi
