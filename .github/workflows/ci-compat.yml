name: DSH compatibility preview

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/**
      - src/compat/dsh/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-preview-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve one preview dependency set
    if: github.repository == 'liang-today/dsh-liangxiang'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dsh: ${{ steps.versions.outputs.dsh }}
      cordis: ${{ steps.versions.outputs.cordis }}
      group: ${{ steps.versions.outputs.group }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.1
      - name: Freeze matching DSH and Cordis versions for all platforms
        id: versions
        env:
          DSH_DIST_TAG: alpha
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const names = ['@deepseek-ai/dsh', '@deepseek-ai/dsh-client-ui-layout', '@deepseek-ai/dsh-client-ui-renderer', '@deepseek-ai/dsh-client-ui-slots', '@deepseek-ai/cordis', '@deepseek-ai/cordis-plugin-group'];
          const manifests = await Promise.all(names.map(async name => {
            const response = await fetch('https://registry.npmjs.org/' + encodeURIComponent(name), { signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error('Registry lookup failed for ' + name + ': ' + response.status);
            return response.json();
          }));
          const tag = process.env.DSH_DIST_TAG;
          const versions = { dsh: manifests[0]['dist-tags']?.[tag], cordis: manifests[4]['dist-tags']?.latest, group: manifests[5]['dist-tags']?.latest };
          for (const value of Object.values(versions)) {
            if (typeof value !== 'string' || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(value)) throw new Error('Invalid registry version');
          }
          const selected = [versions.dsh, versions.dsh, versions.dsh, versions.dsh, versions.cordis, versions.group];
          for (let index = 0; index < names.length; index++) {
            if (!manifests[index].versions?.[selected[index]]) throw new Error('Matching preview package is not published: ' + names[index] + '@' + selected[index]);
            console.log(names[index] + '@' + selected[index]);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(versions).map(([key, value]) => key + '=' + value).join('\n') + '\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Preview dependency set\nChannel: ' + tag + '\n\n' + names.map((name, index) => '- ' + name + '@' + selected[index]).join('\n') + '\n\nOnly the locked dependency jobs are required for merging. Installation supply-chain policy is unchanged.\n');
          NODE

  verify-preview:
    name: compatibility-alpha (${{ matrix.os }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DSH_VERSION: ${{ needs.resolve.outputs.dsh }}
      CORDIS_VERSION: ${{ needs.resolve.outputs.cordis }}
      CORDIS_GROUP_VERSION: ${{ needs.resolve.outputs.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install the baseline without changing its lockfile
        run: pnpm install --frozen-lockfile
      - name: Install the exact preview set
        id: preview-install
        run: pnpm add -D --save-exact "@deepseek-ai/dsh@$DSH_VERSION" "@deepseek-ai/dsh-client-ui-layout@$DSH_VERSION" "@deepseek-ai/dsh-client-ui-renderer@$DSH_VERSION" "@deepseek-ai/dsh-client-ui-slots@$DSH_VERSION" "@deepseek-ai/cordis@$CORDIS_VERSION" "@deepseek-ai/cordis-plugin-group@$CORDIS_GROUP_VERSION"
      - name: Record tested versions
        run: |
          node --version
          pnpm --version
          pnpm ls --depth 0 @deepseek-ai/dsh @deepseek-ai/cordis @deepseek-ai/cordis-plugin-group @deepseek-ai/dsh-client-ui-layout @deepseek-ai/dsh-client-ui-renderer @deepseek-ai/dsh-client-ui-slots
      - name: Complete verification against the preview
        id: checks
        run: pnpm run verify
      - name: Summarize the compatibility check
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.preview-install.outcome }}
          VERIFY_RESULT: ${{ steps.checks.outcome }}
        run: |
          {
            echo "### Alpha compatibility: $RUNNER_OS"
            echo "- Commit: $GITHUB_SHA"
            echo "- DSH: $DSH_VERSION"
            echo "- Preview installation: $INSTALL_RESULT"
            echo "- Complete verification: $VERIFY_RESULT"
            echo "This check is advisory. Failures remain visible and do not replace the three required locked-dependency checks."
          } >> "$GITHUB_STEP_SUMMARY"
