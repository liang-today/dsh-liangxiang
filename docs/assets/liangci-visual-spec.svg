      .week { fill: #f4f5f8; stroke: #d9dde5; stroke-width: 1; }
      .small { font-size: 11px; }
      .label { font-size: 12px; font-weight: 600; }
      .title { font-size: 20px; font-weight: 750; }
      .number { font-variant-numeric: tabular-nums; }
