    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .primary { fill: #1c2130; }
      .secondary { fill: #5a6472; }
      .tertiary { fill: #8a93a2; }
      .brand { fill: #4d6bfe; }
      .warn { fill: #d8873a; }
      .seal { fill: #b84a3a; }
      .day { fill: #f8f9fb; stroke: #d9dde5; stroke-width: 1; }
